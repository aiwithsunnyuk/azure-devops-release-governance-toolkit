parameters:
  - name: scanTarget
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: severityThreshold
    type: string
    default: 'HIGH,CRITICAL'

steps:
  - task: Bash@3
    displayName: 'Execute Container Vulnerability & Code Scanner'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        echo "Initiating vulnerability scan against: ${{ parameters.scanTarget }}"
        
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ parameters.scanTarget }}:/workspace \
          aquasec/trivy:latest fs \
          --exit-code 1 \
          --severity ${{ parameters.severityThreshold }} \
          /workspace
