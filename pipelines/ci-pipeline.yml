trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Lint_and_Scan
    displayName: 'Static Analysis & Compliance Scan'
    jobs:
      - job: CodeGovernance
        steps:
          - checkout: self
          - template: templates/steps/sast-scan.yml
            parameters:
              scanTarget: '$(Build.SourcesDirectory)'
              severityThreshold: 'HIGH,CRITICAL'
